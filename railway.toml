[build]
builder = "RAILPACK"
buildCommand = "npm --workspace @perps/server run build"
watchPatterns = ["/server/**", "/packages/engine/**", "/redline3d/**", "/package.json", "/package-lock.json", "/railway.toml"]

[deploy]
preDeployCommand = ["npm --workspace @perps/server run db:migrate"]
startCommand = "npm --workspace @perps/server run start"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

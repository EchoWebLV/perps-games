[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Size-optimize: the deploy rent is paid per byte and this wallet is tight.
opt-level = "s"
strip = true
panic = "abort"
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

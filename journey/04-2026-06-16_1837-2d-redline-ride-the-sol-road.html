<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>REDLINE — ride the SOL road</title>
<style>
:root{--txt:#eaf0ff;--dim:#9aa6c8;--faint:#6a76a0;--grn:#2ee6a6;--gold:#ffd166;--red:#ff4d6d;--blu:#4da6ff;--mag:#ff39c0;--cyan:#27e7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05030d}
body{font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;color:var(--txt);position:fixed;inset:0}
#road,#fx{position:fixed;inset:0;display:block;width:100%;height:100%}
#road{z-index:1} #fx{z-index:3;pointer-events:none}
.hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;max-width:460px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 14px}
.hud .pe{pointer-events:auto}
.gas{position:fixed;left:10px;bottom:12px;z-index:2;display:flex;flex-direction:column;align-items:stretch;gap:6px;width:210px;max-width:54vw;pointer-events:auto;touch-action:none}
.gas .tach{align-self:center;width:206px;margin:2px auto 0}
.speedo{position:fixed;right:8px;bottom:8px;z-index:2;display:flex;flex-direction:column;align-items:center;pointer-events:auto;touch-action:none}
.speedo .tach{width:246px}
.speedo .glabel{text-align:center;margin-top:-4px}
.gas .glabel{text-align:center;margin-top:-2px}
.gas .seg{padding:6px 8px}
.gas .status{position:static;text-align:left;font-size:10px;margin-top:2px;min-height:0}
.glev{font-family:ui-monospace;font-weight:900;font-size:21px;color:var(--grn);text-shadow:0 0 14px rgba(46,230,166,.5)}
.gtrack{position:relative;width:32px;height:38vh;max-height:320px;border-radius:16px;background:rgba(8,6,20,.62);border:1px solid rgba(120,140,210,.28);overflow:hidden;backdrop-filter:blur(5px);cursor:pointer}
.gfill{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(0deg,#1f7d5e,#2ee6a6 50%,var(--gold) 78%,#ff7a3c 90%,var(--red));transition:height .04s}
.gredline{position:absolute;left:0;right:0;bottom:80%;height:2px;background:var(--red);box-shadow:0 0 8px var(--red);z-index:2}
.gknob{position:absolute;left:-3px;right:-3px;bottom:34%;height:6px;border-radius:4px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.75);z-index:3}
.glabel{font-size:9px;letter-spacing:.12em;color:var(--faint);font-weight:800}
.gas .go{width:100%;padding:12px 6px;font-size:15px;margin:2px 0 0}

.hbar{display:flex;align-items:flex-start;justify-content:space-between}
.chip{background:rgba(8,6,20,.5);backdrop-filter:blur(4px);border:1px solid rgba(120,140,210,.22);border-radius:10px;padding:5px 9px;font-size:10px;font-weight:700;color:var(--dim);line-height:1.25}
.chip b{display:block;color:var(--txt);font-size:15px;font-weight:900}
.chip .ok{color:var(--grn)} .chip .sim{color:var(--gold)}
.reset{color:var(--blu);font-size:9px;border:1px solid rgba(120,140,210,.25);border-radius:6px;padding:0 5px;margin-left:6px;cursor:pointer;pointer-events:auto}

.mini{margin:8px 0 0;height:58px;border-radius:12px;background:rgba(8,6,20,.5);backdrop-filter:blur(4px);border:1px solid rgba(120,140,210,.22);overflow:hidden}
.mini canvas{width:100%;height:100%;display:block}
.mid{position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.6);pointer-events:none}
.m{font-family:ui-monospace,"SF Mono",monospace;font-weight:800;font-size:58px;line-height:1;color:var(--grn);text-shadow:0 0 26px rgba(46,230,166,.6)}
.msub{font-size:12px;color:#cdd6f5;margin-top:4px;font-weight:700}

.dash{display:flex;flex-direction:column;gap:9px}
.dpanel{background:rgba(8,6,20,.62);backdrop-filter:blur(7px);border:1px solid rgba(120,140,210,.22);border-radius:16px;padding:10px 12px;display:flex;gap:11px;align-items:center}
.tach{width:96px;flex:none}
.tach svg{width:100%;display:block}
.thrcol{flex:1}
.thrcol .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.thrcol .lab{font-size:9px;letter-spacing:.14em;color:var(--faint);font-weight:800}
.redtag{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--red);opacity:0;transition:.15s}
.redtag.on{opacity:1;animation:bl .55s infinite}@keyframes bl{50%{opacity:.3}}
input[type=range]#throttle{-webkit-appearance:none;width:100%;height:18px;border-radius:11px;outline:none;background:linear-gradient(90deg,#1f7d5e,#2ee6a6 30%,var(--gold) 58%,#ff7a3c 75%,var(--red));box-shadow:inset 0 0 0 1px rgba(120,140,210,.3)}
input[type=range]#throttle::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd8ee);border:3px solid #0a0820;box-shadow:0 0 16px rgba(255,255,255,.6);cursor:pointer}
input[type=range]#throttle::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #0a0820;cursor:pointer}

.ctrls{display:flex;gap:9px}
.seg{flex:1;background:rgba(8,6,20,.62);backdrop-filter:blur(7px);border:1px solid rgba(120,140,210,.22);border-radius:13px;padding:7px 9px}
.seg .lab{font-size:9px;letter-spacing:.12em;color:var(--faint);font-weight:800;display:block;margin-bottom:5px}
.opts{display:flex;gap:6px}
.opt{flex:1;text-align:center;padding:7px 0;border:1px solid rgba(120,140,210,.3);border-radius:9px;font-weight:800;font-size:13px;color:var(--dim);cursor:pointer;transition:.12s}
.opt.long.on{background:rgba(46,230,166,.18);border-color:var(--grn);color:var(--grn)}
.opt.short.on{background:rgba(255,77,109,.18);border-color:var(--red);color:var(--red)}
.stake{display:flex;align-items:center;gap:6px}
.stk-btn{width:30px;height:30px;border:1px solid rgba(120,140,210,.3);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--txt);cursor:pointer}
.stk-val{flex:1;text-align:center;font-weight:900;font-size:15px}

.go{width:100%;border:none;border-radius:15px;padding:16px;font-size:18px;font-weight:900;letter-spacing:.04em;color:#06121a;cursor:pointer;text-transform:uppercase;background:linear-gradient(180deg,#43f0b0,#13c98a);box-shadow:0 8px 26px rgba(46,230,166,.36)}
.go:active{transform:translateY(2px)}
.go.cash{background:linear-gradient(180deg,#ffe08a,#ffc23d);box-shadow:0 8px 26px rgba(255,200,80,.36)}
.go.cash.warn{background:linear-gradient(180deg,#ff9aa6,#ff5067);color:#fff;box-shadow:0 8px 26px rgba(255,80,99,.4)}
.status{text-align:center;font-size:11px;color:#cdd6f5;min-height:15px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.status.win{color:var(--grn)} .status.lose{color:var(--red)} .status b{color:#fff}
</style></head>
<body>
<canvas id="road"></canvas>
<canvas id="fx"></canvas>
<div class="hud">
  <div class="topgrp">
  <div class="hbar">
    <div class="chip pe">balance<b id="bal">$100.00</b><span class="reset" id="reset">↺</span></div>
    <div class="chip" style="text-align:right">SOL<b id="solpx">$—</b><span id="feed" class="sim">connecting…</span></div>
  </div>
  <div class="mini"><canvas id="mini"></canvas></div>
  </div>

  <div class="mid">
    <div class="m" id="multi">×1.00</div>
    <div class="msub" id="multiSub">pick a side, rev up, then LAUNCH</div>
  </div>

  <div class="gas pe" id="gas">
    <button class="go" id="go">🚀 LAUNCH</button>
    <div class="seg"><span class="lab">YOUR CALL</span><div class="opts"><div class="opt long on" data-dir="1">▲ LONG</div><div class="opt short" data-dir="-1">▼ SHORT</div></div></div>
    <div class="seg"><span class="lab">STAKE</span><div class="stake"><div class="stk-btn" id="stkDown">−</div><div class="stk-val" id="stkVal">$1.00</div><div class="stk-btn" id="stkUp">+</div></div></div>
    <div class="status" id="status">Ride <b>LONG/SHORT</b> SOL — rev the throttle, bank before you wreck. <b>↑↓</b> throttle · <b>←→</b> side · <b>Space</b> launch/cash.</div>
  </div>

  <div class="speedo pe" id="speedo">
    <div class="tach pe" id="tach"><svg viewBox="0 0 320 184" id="tachsvg"></svg></div>
    <div class="glabel">LEVERAGE ↑↓ · drag</div>
  </div>
</div>

<script src="feed.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var balance=100, stake=1, dir=1, lev=60, equity=1, inRun=false, over=false;
  var EDGE=0.05, LIQ=0.20, CAP=100, MAXSEC=60, startT=0, entryPx=0;

  /* ---------- real SOL price ---------- */
  var solTarget=0, solPx=0, solPrev=0, solEMA=0, rawPrev=0, feedLive=false, lastTick=0, feedLabel='connecting…';
  PythPro.connect({
    feeds:[{key:'SOL', lz:6, hx:'ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d', expo:-8}],
    onPrice:function(k,v){ if(v>0){ solTarget=v; if(!solPx){solPx=solEMA=v;solPrev=v;} feedLive=true; lastTick=Date.now(); } },
    onStatus:function(s){ feedLabel=s.label; }
  });
  setInterval(function(){if(Date.now()-lastTick>2500){feedLive=false;if(!solTarget)solTarget=172;solTarget=Math.max(1,solTarget*(1+(Math.random()-0.5)*0.0018));}},200);
  setInterval(function(){$('solpx').textContent='$'+(solPx?solPx.toFixed(2):'—');var live=feedLive&&(Date.now()-lastTick<2500);$('feed').className=live?'ok':'sim';$('feed').textContent=live?feedLabel:'sim';},400);

  /* ---------- tachometer ---------- */
  var CX=160,CY=170,R=140,RMIN=10,RMAX=2000,REDLINE=700,gfrac=0.34;
  function lf(l){return Math.log(l/RMIN)/Math.log(RMAX/RMIN);}
  function tToLev(t){return RMIN*Math.pow(RMAX/RMIN,t/100);}
  function niceLev(l){return l<100?Math.round(l/5)*5:l<500?Math.round(l/10)*10:Math.round(l/50)*50;}
  function pt(f,rad){var a=Math.PI*(1-f);return[CX+rad*Math.cos(a),CY-rad*Math.sin(a)];}
  function arc(f0,f1,rad,n){var d='',i,f,p;for(i=0;i<=n;i++){f=f0+(f1-f0)*i/n;p=pt(f,rad);d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}return d;}
  function gcol(){var rf=lf(REDLINE);return gfrac>=rf?'#ff4d6d':gfrac>=0.40?'#ffd166':'#2ee6a6';}
  function buildGauge(){
    var s='',i,f,p1,p2;
    s+='<path d="'+arc(0,1,R,56)+'" fill="none" stroke="#1a2036" stroke-width="16" stroke-linecap="round"/>';
    s+='<path d="'+arc(lf(REDLINE),1,R,22)+'" fill="none" stroke="rgba(255,77,109,.4)" stroke-width="16"/>';
    for(i=0;i<=10;i++){f=i/10;p1=pt(f,R-9);p2=pt(f,R+(i%5===0?12:6));s+='<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="rgba(154,166,200,'+(i%5===0?'.85':'.4')+')" stroke-width="'+(i%5===0?2.5:1)+'"/>';}
    s+='<path id="tachfill" fill="none" stroke="#2ee6a6" stroke-width="16" stroke-linecap="round"/>';
    s+='<line id="tachneedle" x1="'+CX+'" y1="'+CY+'" x2="'+CX+'" y2="40" stroke="#fff" stroke-width="4" stroke-linecap="round"/>';
    s+='<circle id="tachhub" cx="'+CX+'" cy="'+CY+'" r="11" fill="#0a0820" stroke="#2ee6a6" stroke-width="3"/>';
    s+='<text id="tachval" x="'+CX+'" y="150" text-anchor="middle" font-family="ui-monospace,monospace" font-size="46" font-weight="900" fill="#2ee6a6">60×</text>';
    $('tachsvg').innerHTML=s;
  }
  function updateGauge(){
    var c=gcol();
    var ff=$('tachfill');if(ff){ff.setAttribute('d',arc(0,Math.max(0.001,gfrac),R,Math.max(2,Math.round(gfrac*56))));ff.setAttribute('stroke',c);}
    var nd=$('tachneedle');if(nd){var tip=pt(gfrac,R-34);nd.setAttribute('x2',tip[0].toFixed(1));nd.setAttribute('y2',tip[1].toFixed(1));nd.setAttribute('stroke',c);}
    var hb=$('tachhub');if(hb)hb.setAttribute('stroke',c);
    var tv=$('tachval');if(tv){tv.textContent=lev+'×';tv.setAttribute('fill',c);}
  }

  /* ---------- canvases ---------- */
  var road=$('road'),rc=road.getContext('2d'),fx=$('fx'),fxc=fx.getContext('2d'),mini=$('mini'),mc=mini.getContext('2d'),W=0,H=0,DPR=1;
  var MINI_N=300, priceHist=[];
  function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;[road,fx].forEach(function(c){c.width=W*DPR;c.height=H*DPR;});rc.setTransform(DPR,0,0,DPR,0,0);fxc.setTransform(DPR,0,0,DPR,0,0);}
  addEventListener('resize',fit);fit();

  /* ---------- pseudo-3D road ---------- */
  var CAMD=0.84, CAMH=900, ROADW=1700, SEGLEN=220, DRAW=110;
  var pos=0, curHB=0, carRideY=0, segMap={};
  function proc(i){return Math.sin(i*0.0125)*620+Math.sin(i*0.031)*300+Math.sin(i*0.0061)*900;}
  function pcurve(i){return Math.sin(i*0.0067)*2.3+Math.sin(i*0.017)*1.5;}
  function genSeg(i){return {y:proc(i)+curHB, curve:pcurve(i)};}
  function getSeg(i){var s=segMap[i];if(!s){s=genSeg(i);segMap[i]=s;}return s;}
  function rgb(r,g,b){return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
  function quad(x1,y1,x2,y2,x3,y3,x4,y4,col){rc.fillStyle=col;rc.beginPath();rc.moveTo(x1,y1);rc.lineTo(x2,y2);rc.lineTo(x3,y3);rc.lineTo(x4,y4);rc.closePath();rc.fill();}

  function drawRoad(){
    // sky
    var g=rc.createLinearGradient(0,0,0,H*0.62);g.addColorStop(0,'#160a2e');g.addColorStop(.55,'#3a1152');g.addColorStop(1,'#7a1d5e');rc.fillStyle=g;rc.fillRect(0,0,W,H*0.62);
    rc.fillStyle='#05030d';rc.fillRect(0,H*0.62,W,H*0.38);
    // sun
    var sx=W/2,sy=H*0.40,sr=Math.min(W*0.18,90);var sg=rc.createLinearGradient(0,sy-sr,0,sy+sr);sg.addColorStop(0,'#ffe27a');sg.addColorStop(1,'#ff3d7f');rc.fillStyle=sg;rc.beginPath();rc.arc(sx,sy,sr,0,7);rc.fill();
    // (sun scanlines removed — the multiplier sits inside the sun instead)
    // stars
    rc.fillStyle='rgba(255,255,255,.5)';for(var st=0;st<26;st++){var px=(st*131%W),py=((st*71)%(H*0.34));rc.fillRect(px,py,1.5,1.5);}

    var baseSeg=Math.floor(pos/SEGLEN);
    var camY=CAMH+getSeg(baseSeg).y;
    var pts=[],i,n,s;
    for(n=0;n<=DRAW;n++){i=baseSeg+n;s=getSeg(i);var dz=i*SEGLEN-pos;if(dz<1)dz=1;var sc=CAMD/dz;pts[n]={sx:W/2, sy:H/2-sc*(s.y-camY)*H/2, sw:sc*ROADW*W/2, i:i};}
    var liqGlow=inRun&&equity<0.55, win=inRun&&equity>1.3;
    for(n=DRAW-1;n>=0;n--){
      var a=pts[n],b=pts[n+1];if(!b)continue;
      var seg=baseSeg+n, alt=(Math.floor(seg/3)%2===0), fog=1-n/DRAW;
      // ground grid
      var gA=alt?[26,8,46]:[18,6,34];quad(0,a.sy,W,a.sy,W,b.sy,0,b.sy,rgb(gA[0]*(0.4+fog*0.6),gA[1]*(0.4+fog*0.6),gA[2]*(0.4+fog*0.6)));
      // grid lines on ground
      if(alt){rc.strokeStyle='rgba(255,57,192,'+(0.18+fog*0.26)+')';rc.lineWidth=1;rc.beginPath();rc.moveTo(0,a.sy);rc.lineTo(W,a.sy);rc.stroke();}
      // road
      var rcol=alt?[34,40,66]:[28,33,56];if(liqGlow){rcol=alt?[70,24,40]:[58,20,34];}quad(a.sx-a.sw,a.sy,a.sx+a.sw,a.sy,b.sx+b.sw,b.sy,b.sx-b.sw,b.sy,rgb(rcol[0],rcol[1],rcol[2]));
      // neon edges
      var ew=Math.max(1.5,a.sw*0.08),ec=liqGlow?'#ff3050':win?'#ffd166':(alt?'#27e7ff':'#ff39c0');
      rc.fillStyle=ec;rc.globalAlpha=0.55+fog*0.45;
      quad(a.sx-a.sw,a.sy,a.sx-a.sw+ew,a.sy,b.sx-b.sw+ew*0.4,b.sy,b.sx-b.sw,b.sy,ec);
      quad(a.sx+a.sw-ew,a.sy,a.sx+a.sw,a.sy,b.sx+b.sw,b.sy,b.sx+b.sw-ew*0.4,b.sy,ec);
      rc.globalAlpha=1;
      // center lane dashes (the road marks)
      if(alt){var lw=Math.max(1.5,a.sw*0.06);var dc='rgba(255,255,255,'+(0.5+fog*0.45)+')';rc.fillStyle=dc;quad(a.sx-lw,a.sy,a.sx+lw,a.sy,b.sx+lw*0.5,b.sy,b.sx-lw*0.5,b.sy,dc);}
    }
    drawCar();
  }

  function rrect(x,y,w,h,r){rc.beginPath();rc.moveTo(x+r,y);rc.arcTo(x+w,y,x+w,y+h,r);rc.arcTo(x+w,y+h,x,y+h,r);rc.arcTo(x,y+h,x,y,r);rc.arcTo(x,y,x+w,y,r);rc.closePath();}
  function drawCar(){
    var s=Math.max(0.85,Math.min(1.7,W/300)), cx=W/2, cy=H*0.83-carRideY+Math.sin(Date.now()/420)*2;
    var col=inRun?(equity>=1?'#2ee6a6':'#ff5067'):'#4da6ff';
    rc.save();rc.translate(cx,cy);rc.scale(s,s);
    rc.globalAlpha=.2;rc.fillStyle=col;rc.shadowColor=col;rc.shadowBlur=30;rc.beginPath();rc.ellipse(0,34,72,15,0,0,7);rc.fill();rc.globalAlpha=1;rc.shadowBlur=0;
    if(keyUp||lev>=REDLINE){rc.fillStyle='#ff8a3c';rc.shadowColor='#ff7a3c';rc.shadowBlur=18;rc.beginPath();rc.ellipse(-22,32,6,10,0,0,7);rc.ellipse(22,32,6,10,0,0,7);rc.fill();rc.shadowBlur=0;}
    rc.fillStyle='#07070f';rrect(-66,8,20,30,6);rc.fill();rrect(46,8,20,30,6);rc.fill();
    rc.fillStyle='#11131f';rrect(-58,-27,116,8,3);rc.fill();rc.fillStyle=col;rrect(-58,-28,116,3,2);rc.fill();
    rc.fillStyle='#11131f';rrect(-46,-22,8,9,2);rc.fill();rrect(38,-22,8,9,2);rc.fill();
    var bg=rc.createLinearGradient(0,-18,0,32);bg.addColorStop(0,'#1b2138');bg.addColorStop(1,'#0a0d18');
    rc.fillStyle=bg;rc.beginPath();rc.moveTo(-52,-16);rc.lineTo(52,-16);rc.lineTo(64,30);rc.lineTo(-64,30);rc.closePath();rc.fill();
    rc.strokeStyle=col;rc.lineWidth=2;rc.shadowColor=col;rc.shadowBlur=10;rc.stroke();rc.shadowBlur=0;
    rc.fillStyle='#12172a';rc.beginPath();rc.moveTo(-40,-16);rc.lineTo(40,-16);rc.lineTo(30,-48);rc.lineTo(-30,-48);rc.closePath();rc.fill();
    var wg=rc.createLinearGradient(0,-46,0,-18);wg.addColorStop(0,'#2c3a5e');wg.addColorStop(1,'#0c1020');
    rc.fillStyle=wg;rc.beginPath();rc.moveTo(-32,-20);rc.lineTo(32,-20);rc.lineTo(24,-44);rc.lineTo(-24,-44);rc.closePath();rc.fill();
    rc.fillStyle='#ff2d55';rc.shadowColor='#ff2d55';rc.shadowBlur=keyDn?22:12;rrect(-58,-4,30,9,3);rc.fill();rrect(28,-4,30,9,3);rc.fill();rc.shadowBlur=0;
    rc.fillStyle='#0c0f1a';rrect(-40,12,80,12,3);rc.fill();
    rc.globalAlpha=.7;rc.fillStyle='#cdd6f5';rrect(-14,14,28,8,2);rc.fill();rc.globalAlpha=1;
    rc.restore();
  }

  /* ---------- particles ---------- */
  var parts=[],flashA=0,flashCol='46,230,166',shake=0;
  function flash(c,a){flashCol=c;flashA=a;}
  function burst(x,y,col,n){for(var i=0;i<(n||30);i++){var a=Math.random()*6.283,sp=2+Math.random()*7;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,g:.12,size:2+Math.random()*4,col:col});}}
  function coins(){flash('46,230,166',.4);for(var i=0;i<50;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,life:1.7,g:.12,size:4+Math.random()*4,col:['255,210,90','46,230,166'][i%2],txt:Math.random()<.4?'🪙':null});}
  function floater(x,y,t,c){parts.push({x:x,y:y,vx:0,vy:-1.1,life:1.7,g:.02,size:0,col:c,big:t});}
  function buzz(p){if(navigator.vibrate)try{navigator.vibrate(p);}catch(e){}}
  function drawFx(){
    fxc.clearRect(0,0,W,H);
    if(flashA>.001){fxc.fillStyle='rgba('+flashCol+','+(flashA*.5)+')';fxc.fillRect(0,0,W,H);flashA*=.88;}
    for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life-=.016;if(p.life<=0||p.y>H+40){parts.splice(i,1);continue;}fxc.globalAlpha=Math.max(0,Math.min(1,p.life));if(p.big){fxc.font='900 26px ui-monospace';fxc.fillStyle='rgb('+p.col+')';fxc.textAlign='center';fxc.fillText(p.big,p.x,p.y);fxc.textAlign='left';}else if(p.txt){fxc.font='15px serif';fxc.fillText(p.txt,p.x,p.y);}else{fxc.beginPath();fxc.arc(p.x,p.y,p.size,0,7);fxc.fillStyle='rgb('+p.col+')';fxc.fill();}fxc.globalAlpha=1;}
    if(shake>.4){shake*=.86;road.style.transform='translate('+((Math.random()-.5)*shake)+'px,'+((Math.random()-.5)*shake)+'px)';}else road.style.transform='';
  }

  function lerpCol(t){t=Math.max(0,Math.min(1,t));var a=[46,230,166],b=[255,210,90],c=[255,77,109],o;if(t<.5){var u=t/.5;o=[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];}else{var v=(t-.5)/.5;o=[b[0]+(c[0]-b[0])*v,b[1]+(c[1]-b[1])*v,b[2]+(c[2]-b[2])*v];}return 'rgb('+(o[0]|0)+','+(o[1]|0)+','+(o[2]|0)+')';}
  function fmt(n){return '$'+n.toFixed(2);}
  function status(m,c){var s=$('status');s.innerHTML=m;s.className='status'+(c?' '+c:'');}

  /* ---------- minimap: SOL price line, car rides the latest point ---------- */
  function drawMini(){
    var w=mini.clientWidth,h=mini.clientHeight; if(!w||!h)return;
    if(mini.width!==(w*DPR|0)||mini.height!==(h*DPR|0)){mini.width=w*DPR;mini.height=h*DPR;mc.setTransform(DPR,0,0,DPR,0,0);}
    mc.clearRect(0,0,w,h);
    var nlen=priceHist.length; if(nlen<2)return;
    // scale ALWAYS to the price history so the curve looks the same in/out of a run
    var lo=Infinity,hi=-Infinity,i,v;
    for(i=0;i<nlen;i++){v=priceHist[i];if(v<lo)lo=v;if(v>hi)hi=v;}
    var pad=(hi-lo)*0.18||(hi*0.0008)||1; lo-=pad; hi+=pad; var rng=hi-lo||1, off=MINI_N-nlen;
    function X(k){return k/(MINI_N-1)*(w-30);} function Y(val){return h-((val-lo)/rng)*h;}
    var col=inRun?(equity>=1?'46,230,166':'255,77,109'):'77,166,255';
    // entry + liq drawn as OVERLAYS — they never rescale the curve
    if(inRun){
      var liqPx=entryPx*(1-dir*(1-LIQ)/lev), ey=Y(entryPx);
      if(liqPx>0){ var ly=Y(liqPx);
        if(ly>=0&&ly<=h){ // liq is on-screen (high leverage) — show the danger zone
          mc.fillStyle='rgba(255,77,109,.12)';if(dir>0)mc.fillRect(0,ly,w,h-ly);else mc.fillRect(0,0,w,ly);
          mc.strokeStyle='rgba(255,77,109,.6)';mc.setLineDash([2,3]);mc.lineWidth=1;mc.beginPath();mc.moveTo(0,ly);mc.lineTo(w,ly);mc.stroke();mc.setLineDash([]);
          mc.fillStyle='rgba(255,120,140,.9)';mc.font='8px ui-monospace';mc.fillText('LIQ',w-46,ly+(dir>0?10:-3));
        } else { // liq off-screen (low leverage) — just hint the direction, don't squash the chart
          mc.fillStyle='rgba(255,120,140,.85)';mc.font='8px ui-monospace';mc.fillText('LIQ '+(dir>0?'▼':'▲'),w-52,dir>0?h-3:9);
        }
      }
      if(ey>=0&&ey<=h){ mc.strokeStyle='rgba(205,214,245,.45)';mc.setLineDash([4,4]);mc.lineWidth=1;mc.beginPath();mc.moveTo(0,ey);mc.lineTo(w,ey);mc.stroke();mc.setLineDash([]); }
    }
    mc.beginPath();
    for(i=0;i<nlen;i++){var x=X(off+i),y=Y(priceHist[i]);i?mc.lineTo(x,y):mc.moveTo(x,y);}
    mc.strokeStyle='rgb('+col+')';mc.lineWidth=2;mc.lineJoin='round';mc.shadowColor='rgba('+col+',.7)';mc.shadowBlur=6;mc.stroke();mc.shadowBlur=0;
    mc.lineTo(X(off+nlen-1),h);mc.lineTo(X(off),h);mc.closePath();
    var ag=mc.createLinearGradient(0,0,0,h);ag.addColorStop(0,'rgba('+col+',.22)');ag.addColorStop(1,'rgba('+col+',0)');mc.fillStyle=ag;mc.fill();
    // 2D car riding the graph line (tilts to the local slope)
    var lx=X(off+nlen-1),lyc=Y(priceHist[nlen-1]),cc='rgb('+col+')';
    var cang=0; if(nlen>=2){var px2=X(off+nlen-2),py2=Y(priceHist[nlen-2]);cang=Math.atan2(lyc-py2,lx-px2);} cang=Math.max(-0.5,Math.min(0.5,cang));
    mc.save();mc.translate(lx,lyc);mc.rotate(cang);
    mc.shadowColor=cc;mc.shadowBlur=8;mc.fillStyle=cc;
    mc.beginPath();mc.moveTo(-11,-4);mc.lineTo(-9,-7);mc.lineTo(-4,-7);mc.lineTo(-1,-11);mc.lineTo(4,-11);mc.lineTo(7,-7);mc.lineTo(11,-5);mc.lineTo(11,-4);mc.closePath();mc.fill();
    mc.shadowBlur=0;
    mc.fillStyle='rgba(10,8,32,.85)';mc.beginPath();mc.moveTo(-3,-7.5);mc.lineTo(-1,-10);mc.lineTo(3.5,-10);mc.lineTo(5,-7.5);mc.closePath();mc.fill();
    mc.fillStyle='#0a0820';mc.beginPath();mc.arc(-6,-3,3.1,0,7);mc.fill();mc.beginPath();mc.arc(6,-3,3.1,0,7);mc.fill();
    mc.fillStyle=cc;mc.beginPath();mc.arc(-6,-3,1.3,0,7);mc.fill();mc.beginPath();mc.arc(6,-3,1.3,0,7);mc.fill();
    mc.restore();
    mc.fillStyle='rgba(154,166,200,.85)';mc.font='9px ui-monospace';mc.fillText('SOL',6,12);
    mc.textAlign='right';mc.fillStyle='rgb('+col+')';mc.fillText('$'+priceHist[nlen-1].toFixed(2),w-6,12);mc.textAlign='left';
  }

  /* ---------- main loop ---------- */
  function loop(){
    if(keyUp)applyThrottle(throttleT+1.15); if(keyDn)applyThrottle(throttleT-1.15);
    // price + road terrain
    if(solTarget>0){solPx+=(solTarget-solPx)*0.10; solEMA+=(solPx-solEMA)*(solEMA?0.0016:1);}
    curHB=Math.max(-1500,Math.min(1500,(solEMA?(solPx/solEMA-1):0)*46000));
    // P&L uses the RAW price (smoothing is display-only) — keeps the house edge intact.
    var r=(solTarget>0&&rawPrev>0)?(solTarget-rawPrev)/rawPrev:0; rawPrev=solTarget; solPrev=solPx;
    if(solPx>0){priceHist.push(solPx);if(priceHist.length>MINI_N)priceHist.shift();}
    var speed=24+Math.pow(lf(lev),1.5)*1400; pos+=speed;   // very slow at min lev, punchy near redline
    if(Math.floor(pos/SEGLEN)>3000){var k;for(k in segMap)if(+k<Math.floor(pos/SEGLEN)-4)delete segMap[k];}

    if(inRun&&!over){
      equity*=(1+dir*lev*r);if(equity<0)equity=0;
      var elapsed=(Date.now()-startT)/1000, payout=stake*equity*(1-EDGE);
      var mEl=$('multi'),col=equity>=1?lerpCol((equity-1)/8):'rgb(255,77,109)';
      mEl.textContent='×'+equity.toFixed(2);mEl.style.color=col;mEl.style.textShadow='0 0 '+(20+Math.min(40,equity*4))+'px '+col.replace('rgb(','rgba(').replace(')',',.65)');
      $('multiSub').innerHTML='cash '+fmt(payout)+' · '+lev+'× · entry $'+entryPx.toFixed(2);
      var go=$('go');go.className='go cash'+(equity<1?' warn':'');go.textContent=(equity>=1?'CASH OUT ':'BAIL ')+fmt(payout);
      updateGauge();
      if(equity<=LIQ)liquidate();else if(equity>=CAP){equity=CAP;settle(true,true);}else if(elapsed>=MAXSEC)settle(true);
    }
    // car rides your leveraged P&L — moves with the graph, leverage amplifies the swing (only during a run)
    var rideTgt=(inRun&&!over)?Math.max(-0.85,Math.min(2.4,(equity-1)*0.85)):0;
    carRideY+=(rideTgt*72-carRideY)*0.12;
    drawRoad();drawFx();drawMini();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- round control ---------- */
  function launch(){
    if(inRun){settle(false);return;}
    if(balance<stake){status('Not enough balance — lower your stake.','lose');return;}
    if(!solPx){status('Waiting for the SOL feed… one sec.','');return;}
    balance-=stake;$('bal').textContent=fmt(balance);equity=1;inRun=true;over=false;startT=Date.now();entryPx=solPx;
    burst(W/2,H*0.86,dir>0?'46,230,166':'255,77,109',24);buzz(12);flash(dir>0?'46,230,166':'255,77,109',.18);
    status('Riding '+(dir>0?'LONG':'SHORT')+' SOL at '+lev+'× from $'+entryPx.toFixed(2)+'. Work the throttle — cash before you wreck.','');
  }
  function settle(auto,capped){
    if(!inRun||over)return;over=true;inRun=false;
    var winAmt=stake*Math.max(0,equity)*(1-EDGE),profit=winAmt-stake;balance+=winAmt;$('bal').textContent=fmt(balance);
    $('multi').style.color=profit>=0?'var(--grn)':'var(--gold)';
    if(profit>=0)coins();buzz(26);
    floater(W/2,H*0.4,(profit>=0?'+':'')+fmt(winAmt),profit>=0?'#ffd166':'#ff9aa6');
    $('multiSub').innerHTML=(capped?'🏁 MAX PAYOUT ×'+CAP+' — ':auto?'⏱ time cap — ':'')+'cashed at ×'+equity.toFixed(2)+' · SOL $'+solPx.toFixed(2);
    status((profit>=0?'✅ Banked ':'Bailed for ')+fmt(winAmt)+' ('+(profit>=0?'+':'')+fmt(profit)+'). Rev up and launch again!',profit>=0?'win':'lose');
    endBtn();
  }
  function liquidate(){
    if(over)return;over=true;inRun=false;
    $('multi').textContent='×0.00';$('multi').style.color='var(--red)';$('multiSub').innerHTML='💥 WRECKED — liquidated · SOL $'+solPx.toFixed(2);
    burst(W/2,H*0.86,'255,77,109',46);flash('255,77,109',.6);shake=20;buzz([30,60,30]);
    floater(W/2,H*0.4,'−'+fmt(stake),'#ff5067');
    status('💥 Liquidated at '+lev+'×. Lost '+fmt(stake)+'. That deep in the redline, a tiny SOL wobble wrecks you — ease off next run.','lose');
    endBtn();
  }
  function endBtn(){var go=$('go');go.className='go';go.textContent='🚀 LAUNCH';}

  /* ---------- controls ---------- */
  $('go').addEventListener('click',launch);
  var throttleT=34, keyUp=false, keyDn=false;
  function applyThrottle(t){
    throttleT=Math.max(0,Math.min(100,t)); gfrac=throttleT/100; lev=niceLev(tToLev(throttleT));
    updateGauge();
    if(!inRun)$('multiSub').textContent='throttle '+lev+'× — '+(lev>=REDLINE?'REDLINE: max thrust':lev>=170?'aggressive':'cruising');
  }
  function gaugeFromPoint(cx,cy){var svg=$('tachsvg'),r=svg.getBoundingClientRect();if(!r.width)return;var vx=(cx-r.left)/r.width*320,vy=(cy-r.top)/r.height*184;var ang=Math.atan2(CY-vy,vx-CX);if(ang<0)ang=(vx<CX)?Math.PI:0;applyThrottle(Math.max(0,Math.min(1,1-ang/Math.PI))*100);}
  var gdrag=false;
  $('tach').addEventListener('pointerdown',function(e){gdrag=true;gaugeFromPoint(e.clientX,e.clientY);e.preventDefault();});
  addEventListener('pointermove',function(e){if(gdrag)gaugeFromPoint(e.clientX,e.clientY);});
  addEventListener('pointerup',function(){gdrag=false;});
  function setDir(d){if(inRun)return;dir=d;document.querySelectorAll('.opt[data-dir]').forEach(function(x){x.classList.toggle('on',parseInt(x.getAttribute('data-dir'),10)===d);});}
  document.querySelectorAll('.opt[data-dir]').forEach(function(o){o.addEventListener('click',function(){setDir(parseInt(o.getAttribute('data-dir'),10));});});
  addEventListener('keydown',function(e){var k=e.key;
    if(k==='ArrowUp'||k==='w'||k==='W'){keyUp=true;e.preventDefault();}
    else if(k==='ArrowDown'||k==='s'||k==='S'){keyDn=true;e.preventDefault();}
    else if(k==='ArrowLeft'||k==='a'||k==='A'){setDir(1);e.preventDefault();}
    else if(k==='ArrowRight'||k==='d'||k==='D'){setDir(-1);e.preventDefault();}
    else if(k===' '||k==='Enter'){launch();e.preventDefault();}
  });
  addEventListener('keyup',function(e){var k=e.key;if(k==='ArrowUp'||k==='w'||k==='W')keyUp=false;else if(k==='ArrowDown'||k==='s'||k==='S')keyDn=false;});
  $('stkUp').addEventListener('click',function(){if(inRun)return;stake=Math.min(50,stake+1);$('stkVal').textContent=fmt(stake);});
  $('stkDown').addEventListener('click',function(){if(inRun)return;stake=Math.max(1,stake-1);$('stkVal').textContent=fmt(stake);});
  $('reset').addEventListener('click',function(){if(inRun)return;balance=100;$('bal').textContent=fmt(balance);equity=1;$('multi').textContent='×1.00';$('multi').style.color='var(--grn)';status('Balance reset to $100. Rev up and ride the SOL road.','');});

  buildGauge();applyThrottle(throttleT);
})();
</script>
</body></html>

[package]
name = "crate-roll"
version = "0.1.0"
description = "MagicBlock VRF consumer for crate pulls: request + identity-verified callback storing 32 random bytes on a per-player nonce'd PDA. No funds, no roster, no odds."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "crate_roll"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
# Two forced deviations from the plan's `ephemeral-vrf-sdk = { "0.3.0", features = ["anchor"] }`:
#  1. version 0.4.1, NOT 0.3.0 — 0.3.0/0.3.1 are YANKED on crates.io. 0.4.1 is also the version
#     raider already pulls transitively via ephemeral-rollups-sdk, so this unifies to a single
#     SDK crate (no dual-version, raider's build untouched).
#  2. feature `anchor-compat`, NOT `anchor` — `anchor` maps to `anchor-modern` -> anchor-lang 1.0
#     + solana-program 3.0, which cannot unify with the workspace's anchor-lang 0.32.1 (the
#     `#[vrf]` macro's generated `invoke_signed` would mix incompatible AccountInfo types), and
#     would also collide with raider's existing `anchor-compat` on the same 0.4.1 crate (the SDK
#     `compile_error!`s if both anchor-modern and anchor-compat are enabled). `anchor-compat`
#     targets anchor-lang >=0.28,<1.0 -> unifies to 0.32.1. Verified against the SDK compat matrix.
ephemeral-vrf-sdk = { version = "0.4.1", features = ["anchor-compat"] }
# anchor-lang 0.32.1's reconstructed `solana_program` shim drops the deprecated `keccak`
# re-export, so `use anchor_lang::solana_program::keccak` (the plan's import) no longer resolves.
# Pull the standalone hasher directly — same 2.2.1 already in the lock via solana-program 2.3.0.
solana-keccak-hasher = "2.2.1"

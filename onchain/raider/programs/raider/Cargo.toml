[package]
name = "raider"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "raider"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Shrinks MAX_ROUND_SECS (state.rs) so the force_close post-deadline path is
# exercisable in a test without a 5-minute wait. NEVER ship with this on.
test-short-deadline = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
ephemeral-rollups-sdk = { version = "0.15.5", features = ["anchor-compat"] }

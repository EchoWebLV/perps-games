[package]
name = "raider"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "raider"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Shrinks MAX_ROUND_SECS (state.rs) so the force_close post-deadline path is
# exercisable in a test without a 5-minute wait. NEVER ship with this on.
test-short-deadline = []
# Stretches MAX_ROUND_SECS (state.rs) to 180s so the permissionless `tick`
# liquidation can be proven against the live feed on a calm market (a ~0.04% move
# can need >60s to cross). Mutually exclusive with test-short-deadline. NEVER ship
# with this on.
test-long-deadline = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
ephemeral-rollups-sdk = { version = "0.15.5", features = ["anchor-compat"] }
# Task 9: native MagicBlock crank (ScheduleTask) for the self-driving tick.
# Versions proven by the Task-8 crank-probe spike (built+deployed GREEN on devnet).
magicblock-magic-program-api = { version = "0.10.1", default-features = false }
bincode = "1.3"

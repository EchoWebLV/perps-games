<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redline — economics bench</title>
<style>
  :root{--bg:#070a10;--panel:#0d121b;--line:#1c2430;--txt:#d4dce8;--dim:#8893a4;--faint:#5b6473;--grn:#2ee6a6;--red:#ff5063;--amb:#ffd166;--blu:#7fd4ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:ui-monospace,"SF Mono",Menlo,monospace;padding:18px;line-height:1.4}
  h1{font-size:17px;margin:0 0 4px} .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  button{background:#13243a;border:1px solid #2e4a6e;color:var(--blu);border-radius:9px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px}
  .stat b{color:var(--txt)} .ok{color:var(--grn)} .sim{color:var(--amb)}
  table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:8px}
  th,td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--faint);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  .edge-pos{color:var(--grn);font-weight:800} .edge-neg{color:var(--red);font-weight:800}
  .grp td{background:#0b1019;color:var(--blu);font-weight:800;text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;text-align:left}
  .note{color:var(--faint);font-size:11px;margin-top:14px;max-width:760px}
</style></head>
<body>
<h1>🏁 Redline economics bench</h1>
<div class="sub">Captures live SOL ticks off the real feed, then replays the EXACT game P&amp;L over them. Edge = house cut; <span class="edge-pos">green = house wins</span>, <span class="edge-neg">red = house loses</span>.</div>
<div class="bar">
  <div class="stat" id="cap">capturing… <b id="capN">0</b> ticks</div>
  <div class="stat">feed <b id="feed" class="sim">connecting…</b></div>
  <div class="stat">SOL <b id="px">$—</b></div>
  <div class="stat">ann.vol <b id="vol">—</b></div>
  <button id="run" disabled>Run analysis</button>
  <button id="more">Capture +60s</button>
</div>
<div id="out"></div>
<div class="note" id="note"></div>
<script src="feed.js?v=3"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  // ---- params mirror the game ----
  var FEE=0.05, LIQ=0.20, MAXSEC=60, FPS=60, W=60;     // W = momentum-look window (~1s) for chart-reading proxy
  var CAP_NEW=25, CAP_OLD=100;
  var CAPTURE_MS=100000;                                // auto-run after ~100s of capture

  // ---- live capture off the real feed (same client + token the game uses) ----
  var ticks=[], feedLabel='connecting…', live=false, lastT=0, t0=0;
  PythPro.connect({
    feeds:[{key:'SOL',lz:6,hx:'ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d',expo:-8}],
    onPrice:function(k,v){ if(v>0){ var now=Date.now(); if(!t0)t0=now; ticks.push([now,v]); live=true; lastT=now; } },
    onStatus:function(s){ feedLabel=s.label; }
  });
  setInterval(function(){
    $('capN').textContent=ticks.length;
    var lv=live&&(Date.now()-lastT<3000);
    $('feed').textContent=lv?feedLabel:'sim/offline'; $('feed').className=lv?'ok':'sim';
    if(ticks.length) $('px').textContent='$'+ticks[ticks.length-1][1].toFixed(2);
    var dur=t0?(Date.now()-t0)/1000:0;
    $('cap').innerHTML='captured <b>'+ticks.length+'</b> ticks · <b>'+dur.toFixed(0)+'s</b>';
    $('run').disabled = ticks.length<400;
  },400);

  // ---- replay engine (faithful to redline.html) ----
  function analyze(){
    if(ticks.length<400){ return; }
    // resample to 60Hz frame series (the game samples the latest price each frame)
    var T=ticks.slice(), step=1000/FPS, px=[], j=0, last=T[0][1], tEnd=T[T.length-1][0];
    for(var t=T[0][0]; t<=tEnd; t+=step){ while(j<T.length&&T[j][0]<=t){last=T[j][1];j++;} px.push(last); }
    var L=px.length, R=new Array(L-1); for(var i=1;i<L;i++) R[i-1]=px[i]/px[i-1]-1;
    // stats
    var mean=R.reduce(function(a,b){return a+b;},0)/R.length, v=0;
    for(i=0;i<R.length;i++) v+=(R[i]-mean)*(R[i]-mean); v/=R.length;
    function ac(lag){var s=0;for(var i=0;i<R.length-lag;i++)s+=(R[i]-mean)*(R[i+lag]-mean);return (s/(R.length-lag))/v;}
    var annVol=Math.sqrt(v)*Math.sqrt(FPS*86400*365)*100;
    $('vol').textContent=annVol.toFixed(1)+'%';
    // shuffled control (destroys autocorrelation, keeps marginal dist)
    function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var k=(Math.random()*(i+1))|0,tmp=a[i];a[i]=a[k];a[k]=tmp;}return a;}
    var Rs=shuffle(R), Ps=new Array(L); Ps[0]=px[0]; for(i=1;i<L;i++) Ps[i]=Ps[i-1]*(1+Rs[i-1]);
    var MAXF=MAXSEC*FPS, N=6000;
    function replay(useShuf,lev,dirMode,pnl,cap,Tgt){
      var PR=useShuf?Ps:px, RR=useShuf?Rs:R, len=PR.length, sum=0,liq=0,win=0,maxp=0;
      for(var rnd=0;rnd<N;rnd++){
        var s=W+((Math.random()*(len-W-2))|0), dir;
        if(dirMode==='mom'){var d=PR[s]-PR[s-W]; dir=d>0?1:(d<0?-1:(Math.random()<0.5?1:-1));}
        else dir=Math.random()<0.5?1:-1;
        var entry=PR[s],eq=1,payout=-1;
        for(var k=0;k<MAXF;k++){
          var idx=s+k; if(idx>=len-1){payout=eq*(1-FEE);break;}
          if(pnl==='cmp') eq*=(1+dir*lev*RR[idx]); else eq=1+dir*lev*(PR[idx+1]/entry-1);
          if(eq<0)eq=0;
          if(eq<=LIQ){payout=0;break;}
          if(eq>=cap){payout=cap*(1-FEE);break;}
          if(Tgt>0&&eq>=Tgt){payout=eq*(1-FEE);break;}
          if(k===MAXF-1)payout=eq*(1-FEE);
        }
        if(payout<0)payout=eq*(1-FEE);
        sum+=payout; if(payout<=0)liq++; if(payout>1)win++; if(payout>maxp)maxp=payout;
      }
      return {edge:(1-sum/N)*100, pLiq:liq/N*100, pWin:win/N*100, maxPay:maxp};
    }
    var LEVS=[60,500,1000,2000];
    var rows=[];
    function block(title){ rows.push({grp:title}); }
    function add(label,lev,r){ rows.push({label:label,lev:lev,edge:r.edge,pLiq:r.pLiq,pWin:r.pWin,maxPay:r.maxPay}); }

    block('CURRENT build — LINEAR P&L, cap ×'+CAP_NEW);
    LEVS.forEach(function(L){ add('linear · random dir · ride',L, replay(false,L,'rand','lin',CAP_NEW,0)); });
    LEVS.forEach(function(L){ add('linear · momentum dir · ride',L, replay(false,L,'mom','lin',CAP_NEW,0)); });

    block('OLD build — COMPOUND P&L, cap ×'+CAP_OLD+'  (the bug)');
    LEVS.forEach(function(L){ add('compound · random dir · ride',L, replay(false,L,'rand','cmp',CAP_OLD,0)); });
    LEVS.forEach(function(L){ add('compound · momentum dir · ride',L, replay(false,L,'mom','cmp',CAP_OLD,0)); });

    block('CONTROL — shuffled ticks (autocorrelation removed)');
    add('compound · momentum · ride',2000, replay(true,2000,'mom','cmp',CAP_OLD,0));
    add('linear · momentum · ride',2000, replay(true,2000,'mom','lin',CAP_NEW,0));

    render(rows);
    $('note').innerHTML='Replay: '+L+' frames @60Hz ('+(L/FPS).toFixed(0)+'s of real ticks), N='+N+' bootstrapped rounds/row, $1 stake, fee '+(FEE*100)+'%, liq ≤×'+LIQ+', '+MAXSEC+'s cap. '+
      'Autocorrelation lag1='+ac(1).toFixed(3)+' lag3='+ac(3).toFixed(3)+' lag5='+ac(5).toFixed(3)+'. '+
      'Edges are sample-specific to this market window; the <i>direction</i> (compound blows up with leverage, linear stays ~+5%) is the robust finding.';
  }
  function render(rows){
    var h='<table><tr><th>config</th><th>lev</th><th>house edge</th><th>P(liq)</th><th>P(win)</th><th>max pay</th></tr>';
    rows.forEach(function(r){
      if(r.grp){ h+='<tr class="grp"><td colspan="6">'+r.grp+'</td></tr>'; return; }
      var cls=r.edge>=0?'edge-pos':'edge-neg', sign=r.edge>=0?'+':'';
      h+='<tr><td>'+r.label+'</td><td>'+r.lev+'×</td><td class="'+cls+'">'+sign+r.edge.toFixed(1)+'%</td>'+
        '<td>'+r.pLiq.toFixed(0)+'%</td><td>'+r.pWin.toFixed(0)+'%</td><td>$'+r.maxPay.toFixed(2)+'</td></tr>';
    });
    h+='</table>'; $('out').innerHTML=h;
    window.__results=rows;
  }
  $('run').addEventListener('click',analyze);
  $('more').addEventListener('click',function(){ CAPTURE_MS+=60000; $('more').textContent='capturing…'; });
  // auto-run once enough has accumulated
  var auto=setInterval(function(){ if(t0 && Date.now()-t0>=CAPTURE_MS && ticks.length>=1000){ clearInterval(auto); analyze(); } },1000);
})();
</script>
</body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wheel Marker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; overflow: hidden; display: flex;
        font: 13px/1.45 -apple-system, system-ui, sans-serif;
        background: #0b0e13; color: #dfe6f0;
      }
      #stage { flex: 1; position: relative; min-width: 0; }
      #stage canvas { display: block; }
      #panel {
        width: 300px; padding: 12px; overflow-y: auto;
        background: #12161f; border-left: 1px solid #232a38;
        display: flex; flex-direction: column; gap: 10px;
      }
      h1 { font-size: 14px; margin: 0; }
      select, button, input {
        background: #1a2230; color: inherit; font: inherit;
        border: 1px solid #2c3648; border-radius: 6px; padding: 6px 8px;
      }
      button { cursor: pointer; }
      button:hover { border-color: #4a80ff; }
      select { flex: 1; }
      .row { display: flex; gap: 6px; align-items: center; }
      .hint { opacity: 0.6; font-size: 11px; }
      .badge { font-size: 11px; opacity: 0.7; }
      #list { display: flex; flex-direction: column; gap: 6px; }
      .circle-item {
        border: 1px solid #2c3648; border-radius: 8px; padding: 8px;
        display: flex; flex-direction: column; gap: 6px;
      }
      .circle-item.selected { border-color: #ffb02e; }
      .circle-item .head { display: flex; justify-content: space-between; align-items: center; }
      .circle-item .head b { color: #ffb02e; font-size: 12px; }
      .circle-item .del { padding: 1px 8px; font-size: 12px; }
      .circle-item .fields { display: flex; gap: 6px; }
      .circle-item label { display: flex; flex-direction: column; gap: 2px; font-size: 10px; opacity: 0.75; flex: 1; }
      .circle-item input { width: 100%; padding: 3px 6px; font-size: 12px; }
      #out {
        width: 100%; height: 160px; resize: vertical; padding: 8px;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0d1118; color: #9fd49f;
        border: 1px solid #2c3648; border-radius: 6px; white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel">
      <h1>Wheel Marker</h1>
      <div class="row">
        <select id="model"></select>
        <button id="axis" title="flip which axis the camera looks along">view: x</button>
      </div>
      <div class="hint">
        drag on empty space = new circle &middot; drag inside = move &middot;
        drag near edge = resize &middot; right-drag = pan &middot; scroll = zoom<br />
        dashed grey rings = the current auto-rig, for reference
      </div>
      <label class="row"><input type="checkbox" id="spin" /> spin test — spins YOUR circles (rigged wheels if none drawn)</label>
      <div id="list"></div>
      <div class="row">
        <button id="copy">copy JSON</button>
        <button id="clear">clear</button>
        <span id="status" class="badge"></span>
      </div>
      <textarea id="out" readonly spellcheck="false"></textarea>
    </div>
    <script type="module" src="/src/tools/wheel-marker.ts"></script>
  </body>
</html>
